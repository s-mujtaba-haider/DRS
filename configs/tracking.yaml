# Ball tracker settings (keys map to ml.tracking.tracker.TrackerConfig). Units: px, px/s.
meas_sigma_px: 3.0
init_vel_sigma: 1500.0
init_acc_sigma: 3000.0
jerk_sigma: 200000.0
gate_chi2: 9.21              # 99% gate, 2 dof
max_speed_px_s: 6000.0
max_consecutive_misses: 5
min_hits_to_confirm: 3
spawn_min_confidence: 0.05   # hysteresis (spawn > extend) is available but measured worse on broadcast clips
extend_min_confidence: 0.05
max_tracks: 40
min_displacement_px: 20.0    # drops static clutter (logos, stumps)
merge_max_gap_frames: 6
outlier_chi2: 13.82          # 99.9%, 2 dof
reliable_min_observed: 8
reliable_min_observed_ratio: 0.5
reliable_max_mean_innovation_px: 12.0
