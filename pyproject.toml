[project]
name = "cricket-drs"
version = "0.1.0"
description = "Research prototype for cricket ball tracking and experimental decision-review analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "s-mujtaba-haider" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "reportlab>=4.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "av>=13.0",
  "pyyaml>=6.0",
  "opencv-python>=4.10",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
gpu = ["ultralytics>=8.3"]  # plus torch/torchvision from https://download.pytorch.org/whl/cu128
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "pandas>=2.2", "matplotlib>=3.9", "scikit-learn>=1.5", "kaggle>=1.6"]

[tool.setuptools.packages.find]
include = ["ml*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
filterwarnings = ["ignore::RuntimeWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["frontend", "data", "storage", "storage-docker", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]  # B008: FastAPI Depends() defaults are idiomatic

[tool.ruff.lint.isort]
known-first-party = ["ml", "backend"]
